<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search UMD</title>

  <!-- ============================================================
       UMD Critical CSS — minimal subset (DS components + tokens)
  ============================================================ -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overscroll-behavior: none; }

    umd-element-navigation-utility:not(:defined),
    umd-element-utility-header:not(:defined),
    umd-element-navigation-header:not(:defined),
    umd-element-nav-item:not(:defined),
    umd-element-call-to-action:not(:defined) { content-visibility: hidden; }
    umd-element-navigation-utility,
    umd-element-utility-header,
    umd-element-navigation-header,
    umd-element-nav-item,
    umd-element-call-to-action { display: block; container-type: normal; }

    :root { font-family: "Interstate", Helvetica, Arial, Verdana, sans-serif; }
    p, li, label, input, textarea, select, button {
      font-family: "Interstate", Helvetica, Arial, Verdana, sans-serif;
    }

    /* Horizontal layout containers */
    [class*="umd-layout-space-horizontal-"] {
      box-sizing: border-box; display: block;
      margin-left: auto; margin-right: auto;
      padding-left: 24px; padding-right: 24px;
    }
    @media (min-width: 768px) {
      [class*="umd-layout-space-horizontal-"] { padding-left: 48px; padding-right: 48px; }
    }
    @media (min-width: 1200px) {
      [class*="umd-layout-space-horizontal-"] { padding-left: 64px; padding-right: 64px; }
    }
    .umd-layout-space-horizontal-full     { max-width: 100%;   }
    .umd-layout-space-horizontal-normal   { max-width: 1280px; }
    .umd-layout-space-horizontal-small    { max-width: 992px;  }
    .umd-layout-space-horizontal-smallest { max-width: 800px;  }

    /* Typography tokens */
    .umd-sans-larger {
      font-size: 18px; line-height: 1.4em; text-wrap: pretty;
    }
    @media (min-width: 650px)  { .umd-sans-larger { font-size: calc(18px + 0.5vw); } }
    @media (min-width: 1024px) { .umd-sans-larger { font-size: 22px; line-height: 1.25em; } }

    .umd-sans-extralarge-uppercase {
      font-size: 18px; line-height: 1.25em;
      font-weight: 800; text-transform: uppercase;
      text-wrap: pretty;
    }
    @media (min-width: 650px)  { .umd-sans-extralarge-uppercase { font-size: calc(18px + 1.16vw); } }
    @media (min-width: 1024px) { .umd-sans-extralarge-uppercase { font-size: 32px; line-height: 1.125em; } }

    .umd-sans-medium { font-size: 16px; line-height: 1.375em; }
    @media (min-width: 650px)  { .umd-sans-medium { font-size: calc(16px + 0.16vw); } }
    @media (min-width: 1024px) { .umd-sans-medium { font-size: 18px; line-height: 1.55em; } }

    .umd-sans-smaller { font-size: 14px; line-height: 1.28em; }
    .umd-sans-min     { font-size: 12px; line-height: 1.16em; }

    /* Eyebrow w/ trailing line on light bg */
    .umd-text-line-trailing-light {
      font-size: 12px; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase;
      position: relative; overflow: hidden; background-color: transparent;
    }
    .umd-text-line-trailing-light::before {
      content: ""; position: absolute; top: 9px; right: 0;
      width: 100vw; height: 1px; background: #000; z-index: 1;
    }
    .umd-text-line-trailing-light > span {
      position: relative; background-color: #fafafa; padding-right: 8px; z-index: 2;
    }

    /* Pill/tag list (DS umd-text-cluster-pill / legacy umd-pill-list) */
    .umd-text-cluster-pill,
    .umd-pill-list {
      margin-top: -8px;
      margin-bottom: 32px;
    }
    .umd-text-cluster-pill > *,
    .umd-pill-list > * {
      font-family: "Interstate", Helvetica, Arial, Verdana, sans-serif;
      font-size: 12px;
      line-height: 1.16em;
      display: inline-block;
      padding: 8px 12px;
      margin-bottom: 0;
      margin-top: 8px;
      margin-right: 4px;
      background-color: #fafafa;
      transition: background-color 0.3s;
      text-decoration: none;
      color: #1a1a1a;
    }
    .umd-text-cluster-pill a:hover,
    .umd-text-cluster-pill a:focus,
    .umd-pill-list a:hover,
    .umd-pill-list a:focus { background-color: #ffd200; }
  </style>

  <link rel="stylesheet" href="styles/app.css" />

  <script src="https://unpkg.com/@universityofmaryland/web-components-library@1.18.2/dist/cdn.js"></script>
</head>
<body class="page--landing">

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <!-- ===== Global utility header ===== -->
  <umd-element-navigation-utility data-alert-off="true" role="navigation" aria-label="Utility navigation"></umd-element-navigation-utility>

  <!-- ===== Site header — black strip with reverse logo + "SEARCH UMD" ===== -->
  <header class="site-header">
    <div class="site-header__inner umd-layout-space-horizontal-full">
      <a class="site-header__logo" href="https://umd.edu" aria-label="University of Maryland">
        <img src="images/logos/footer-logo.svg" alt="" />
      </a>
      <p class="site-header__title umd-sans-larger">Search UMD</p>
    </div>
  </header>

  <!-- ===== Landing search ===== -->
  <main class="landing" id="main-content">
    <div class="landing__inner umd-layout-space-horizontal-smallest">

      <form class="landing__composer" action="results.html" method="get" autocomplete="off">
        <div class="landing__composer-inner">
          <label class="visually-hidden" for="composer-input">Ask a question</label>
          <input id="composer-input" name="q" type="text" placeholder="Type something..." class="umd-sans-medium" />
          <button type="submit" aria-label="Search" class="composer__submit">
            <img src="assets/chevron-submit.svg" alt="" />
          </button>
        </div>
      </form>

      <section class="landing__common" aria-label="Common searches">
        <p class="umd-text-line-trailing-light common-label"><span>Common Searches</span></p>
        <nav class="umd-text-cluster-pill" aria-label="Common search tags">
          <a href="results.html?q=Visit+UMD">Visit UMD</a>
          <a href="results.html?q=Undergraduate+Admissions">Undergraduate Admissions</a>
          <a href="results.html?q=The+Graduate+School">The Graduate School</a>
          <a href="results.html?q=Directory">Directory</a>
        </nav>
      </section>

    </div>
  </main>

</body>
</html>
